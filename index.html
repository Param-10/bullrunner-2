<html>

<head>
    <title>Bulls-GO</title>
    <link rel="manifest" href="manifest.webmanifest">
    <!--- boilerplate -->
    <!-- Link to Google Fonts for Montserrat and Open Sans -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
    <!-- Link to Turf.js library -->
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
    <!-- Link to jQuery library -->
    <script src="https://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>
    <!-- Link to local stylesheet -->
    <link id='stylesheet' href="style.css" rel="stylesheet">
    <!--- Google Maps API -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <!-- Meta tag to set the viewport for responsive design -->
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
</head>

<body>

    <!-- Popup for loading status -->
    <div id="status" class="popup" style="z-index: 10">
        <h2 class="popupTitle">Loading</h2>
    </div>

    <!--- Google Maps container -->
    <div id='map' style='width: 100%; height: 100%;'></div>

    <!--- mapbox -->
    <div id='map' style='width: 100%; height: 100%;'></div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoibnBpbnRvLXJ1IiwiYSI6ImNsbHhzc3p4YTIwengza3MyN2dpZHo0MjMifQ.htwTQMFArOxMhPV0vnNpXg';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/outdoors-v12',
            maxBounds: new mapboxgl.LngLatBounds(
                [-82.5, 27.9], // Southwest coordinates (lng, lat)
                [-82.3, 28.2] // Northeast coordinates (lng, lat)
            ),
            zoom: 13.5,
            center: [-82.41384, 28.06485] // [lng, lat]
        });

        // Add the Geolocate control to the map
        map.addControl(
            new mapboxgl.GeolocateControl({
                positionOptions: {
                    enableHighAccuracy: true
                },
                trackUserLocation: true,
                showUserHeading: true,
            }), 'bottom-left'
        );

        // Add zoom and rotation controls to the map
        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right'); // You can change the position to suit your needs
    </script>


    <!--- Main logo -->
    <div id='logo' style="font-family: Montserrat;">
        BULLS - GO : A Personal PassioGo Client
    </div>

    <!--- Control buttons for stops, buses, routes, and alerts -->
    <div id='controls'>
        <div id='stopsButton' class='SVGcontainer'>
            <img src="assets/mapPin.svg" class='SVGicon'></img>
        </div>
        <div id='busesButton' class='SVGcontainer'>
            <img src="assets/buses.svg" class='SVGicon'></img>
        </div>
        <div id='routesButton' class='SVGcontainer'>
            <img src="assets/routes.svg" class='SVGicon'></img>
        </div>
        <div id='alertsButton' class='SVGcontainer'>
            <img src="assets/bell.svg" class='SVGicon'></img>
        </div>
    </div>

    <!--- Popups for routes, stops, buses, and alerts -->
    <div id='routesList' class='popup' style='display: none;'>
        <h3 class='popupTitle'>Routes</h3>
        </br>
        <div class='x' onclick='$("#routesList").hide()'>
            <img src="assets/x.svg" class="SVGicon"></img>
        </div>
        <div class='popupList'>
            <!--- routes to fill -->
        </div>
    </div>

    <div id='stopsList' class='popup' style='display: none;'>
        <h3 class='popupTitle'>Stops</h3>
        </br>
        <input type="text" placeholder="Stop Name" id="stopSearch">
        <div class='x' onclick='$("#stopsList").hide()'>
            <img src="assets/x.svg" class="SVGicon"></img>
        </div>
        <div class='popupList withSearch'>
            <!--- stops to fill -->
        </div>
    </div>

    <div id='busesList' class='popup' style='display: none;'>
        <h3 class='popupTitle'>Buses</h3>
        </br>
        <input type="text" placeholder="Bus Number" id="busSearch">
        <div class='x' onclick='$("#busesList").hide()'>
            <img src="assets/x.svg" class="SVGicon"></img>
        </div>
        <div class='popupList withSearch'>
            <!--- buses to fill -->
        </div>
    </div>

    <div id='alertsList' class='popup' style='display: none;'>
        <div class='x' onclick='$("#alertsList").hide()'>
            <img src="assets/x.svg" class="SVGicon"></img>
        </div>
        <h3 class='popupTitle'>Alerts</h3>
        </br>
        <div class='popupList'></div>
        <!--- alerts to fill -->
    </div>
    </div>

    <div id="stopContainer" class="popup poppy" style="display: none;">
        <h3 class='popupTitle'></h3>
        </br>
        <div class='x' onclick='$("#stopContainer").hide()'>
            <img src="assets/x.svg" class="SVGicon"></img>
        </div>
        <div class='popupList'>
            <!--- incoming buses to fill -->
        </div>
    </div>

    <!-- Link to local JavaScript file -->
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
